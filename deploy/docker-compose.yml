# Production stack on the server (/opt/lovely-farm): the game behind Caddy, which serves HTTPS to Cloudflare.
# Caddy uses the host network, so the firewall (ufw, only Cloudflare may reach 80/443 — cloudflare.sh) really
# applies to it; Docker-published ports would bypass ufw. The game listens on 127.0.0.1:3000 only.
# Settings come from /opt/lovely-farm/.env (SECURE_COOKIE) — see deploy/README.md.
name: lovely-farm

x-hardening: &hardening
  restart: unless-stopped
  security_opt: [no-new-privileges:true]
  logging:
    driver: json-file
    options: { max-size: 10m, max-file: "3" }

services:
  farm:
    <<: *hardening
    image: lovely-farm:current # loaded by deploy.sh from the CI build
    environment:
      SECURE_COOKIE: ${SECURE_COOKIE:-1} # the site is served over HTTPS
      TRUST_PROXY: "1" # the client IP comes from Caddy's X-Forwarded-For
    ports:
      - "127.0.0.1:3000:3000" # loopback only: Caddy on the host network reaches it, the internet does not
    volumes:
      - farm-data:/data
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    mem_limit: 512m
    pids_limit: 256

  caddy:
    <<: *hardening
    image: caddy:2-alpine
    depends_on: [farm]
    network_mode: host
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./cloudflare.caddy:/etc/caddy/cloudflare.caddy:ro # written by cloudflare.sh
      - ./certs:/etc/caddy/certs:ro # Cloudflare origin certificate
      - caddy-data:/data
      - caddy-config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    mem_limit: 256m

volumes:
  farm-data:
  caddy-data:
  caddy-config:
